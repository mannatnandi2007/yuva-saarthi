<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Cute Yusa mascot outline inside icon -->
  <g transform="translate(106, 106)" filter="url(#glow)">
    <circle cx="150" cy="150" r="130" fill="#ffffff" opacity="0.95" />
    <!-- Big joyful kawaii eyes -->
    <ellipse cx="105" cy="140" rx="14" ry="20" fill="#4a044e" />
    <circle cx="109" cy="133" r="6" fill="#ffffff" />
    <circle cx="102" cy="148" r="3" fill="#ffffff" />
    <ellipse cx="195" cy="140" rx="14" ry="20" fill="#4a044e" />
    <circle cx="199" cy="133" r="6" fill="#ffffff" />
    <circle cx="192" cy="148" r="3" fill="#ffffff" />
    <!-- Cute pink blushes -->
    <circle cx="85" cy="162" r="14" fill="#f472b6" opacity="0.75" />
    <circle cx="215" cy="162" r="14" fill="#f472b6" opacity="0.75" />
    <!-- Happy smiling open mouth -->
    <path d="M 132 165 Q 150 190 168 165" stroke="#4a044e" stroke-width="6" fill="#ec4899" stroke-linecap="round" />
    <!-- Tiny heart antenna on top -->
    <path d="M 150 20 C 145 0 130 5 130 20 C 130 35 150 48 150 48 C 150 48 170 35 170 20 C 170 5 155 0 150 20 Z" fill="#ec4899" />
  </g>
</svg>
